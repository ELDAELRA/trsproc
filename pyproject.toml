[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trsproc"
version = "2.1.2"
description = "A Python library to process Transcriber TRS files"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Gabriele Chingoli", email = "gabriele@elda.org" }
]
maintainers = [
    { name = "Alexandre Sicard", email = "alexandre@elda.org" },
    { name = "Marwa Hadj Salah", email = "marwa@elda.org" },
    { name = "Inae Song", email = "inae@elda.org" },
    { name = "Florian Philippe", email = "florian@elda.org" },
    { name = "Shi Yu", email = "shi@elda.org" }
]
keywords = ['python', 'transcriber', 'trs', 'transcription', 'textgrid', 'nlp']
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "librosa",
    "pandas",
    "praat-parselmouth",
    "praat-textgrids",
    "PyQt6",
    "rich",
    "soundfile",
    "typer",
    'tomli; python_version < "3.11"',
]

[project.urls]
Homepage = "https://github.com/ELDAELRA/trsproc"

[project.scripts]
trsproc = "trsproc.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-md",
    "pytest-emoji",
    "ruff",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
    "mkdocs-redirects>=1.2",
    "pymdown-extensions>=10",
    "mike>=2",
]

[tool.bumpver]
current_version = "2.1.2"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "Bump version {old_version} -> {new_version}"
tag_message = "{new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    '^current_version = "{version}"$',
    '^version = "{version}"$',
]
"src/trsproc/__init__.py" = ['^__version__ = "{version}"$']

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = ["-ra", "--tb=short", "--strict-markers"]
testpaths = ["tests"]
python_files = ["test_*.py"]
